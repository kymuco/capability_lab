<text x="1152" y="236" text-anchor="end" fill="#9fb9cc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">READ SNAPSHOT != CAPABILITY AUTHORITY != PERMISSION</text>
