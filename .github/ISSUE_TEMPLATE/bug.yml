name: Bug report
description: Report reproducible incorrect behavior using synthetic or non-sensitive data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a reproducible problem.

        **Do not include credentials, person-scoped capability records, private Pilot/workspace data,
        private captures, private conversation exports, exploit details, or other sensitive payloads.**
        For security- or privacy-sensitive issues, follow `SECURITY.md` instead.

  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observed behavior and the smallest context needed to understand it.
      placeholder: The system produced...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What behavior or contract did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic or non-sensitive data only.
      render: shell
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: Revision or version
      description: Commit SHA, tag, or package version if known.
      placeholder: 33f63b1...

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version and operating system.
      placeholder: Python 3.11 / Windows 11

  - type: textarea
    id: boundary
    attributes:
      label: Boundary impact
      description: |
        If relevant, identify whether the bug affects provenance, uncertainty, persistence,
        acceptance/current-state selection, progression, privacy, or authority boundaries.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public-report safety
      options:
        - label: I have not included credentials, private person-scoped records, private captures, or other sensitive payloads.
          required: true
