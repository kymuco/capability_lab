<text x="1050" y="422" fill="#8aa1b6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">kept visible outside the electrical frontier</text>

<rect x="1050" y="460" width="428" height="58" rx="12" fill="#08131f" stroke="#244b69"/>
<text x="1073" y="484" fill="#7f9bb2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.2">NO GLOBAL SCORE</text>
<text x="1073" y="507" fill="#c8d5df" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Evidence-backed state, not “human level”.</text>

<line x1="88" y1="536" x2="1510" y2="536" stroke="#204560"/>
<text x="88" y="562" fill="#7391aa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">EVIDENCE-BACKED · BOUNDED SCOPE · ADVISORY PROGRESSION</text>
<text x="1510" y="562" text-anchor="end" fill="#90abc1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">SUPPORTED != MASTERY · PROGRESSION != PERMISSION</text>
</svg>
